<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update profile</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">


    <!-- fonts - awesome cdnjs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- custom css file -->

    <link rel="stylesheet" href="/Assets/CSS/style.css">

</head>

<body>

    <!--------- header section  ----------------->

    <header class="header">

        <section class="flex">

            <a href="index.html" class="logo">Acadira</a>

            <form action="" method="post" class="search-form">
                <input type="text" name="search_box" required placeholder="search courses..." maxlength="100">
                <button type="submit" class="fas fa-search" name=" search_box">                   
                </button>
            </form>

            <div class="icons">
                <div id="menu-btn" class="fas fa-bars"></div>
                <div id="search-btn" class="fas fa-search"></div>
                <div id="user-btn" class="fas fa-user"></div>
                <div id="toggle-btn" class="fas fa-sun"></div>
            </div>

            <div class="profile">
                <img src="/Assets/Images/prof_img.png" class="image" alt="">
                <h3 class="name">Darpan Biswas</h3>
                <p class="role">student</p>
                <a href="profile.html" class="btn">view profile</a>
                <div class="flex-btn">
                    <a href="login.html" class="option-btn">login</a>
                    <a href="register.html" class="option-btn">register</a>
                </div>
            </div>


        </section>

    </header>


    <!--------- header section ends  ----------------->

    <!--------- sidebar section starts  ----------------->

    <div class="side-bar">


        <div class="close-side-bar">
            <i class="fas fa-times"></i>
        </div>


        <div class="profile">
            <img src="/Assets/Images/sideBar_prof_img.png" class="image" alt="" height="100">
            <h3 class="name">Darpan Biswas</h3>
            <p class="role">student</p>
            <a href="profile.html" class="btn">view profile</a>
        </div>

        <nav class="navbar">
            <a href="index.html"><i class="fas fa-home"></i><span>home</span></a>
            <a href="about.html"><i class="fas fa-question"></i><span>about us</span></a>
            <a href="courses.html"><i class="fas fa-graduation-cap"></i><span>courses</span></a>
            <a href="teachers.html"><i class="fas fa-chalkboard-user"></i><span>teachers</span></a>
            <a href="contact.html"><i class="fas fa-headset"></i><span>contact us</span></a>
        </nav>


    </div>

    <!--------- sidebar section ends  ----------------->

 <!--------- Update profile section starts  ----------------->

    <section class="form-container">

        <form action="" method="post" enctype="multipart/form-data">
            <h3>update profile</h3>

            <p>your name</p>
            <input type="text" name="name" placeholder="Darpan Biswas" maxlength="100" class="box">

            <p>your email</p>
            <input type="email" name="email" placeholder="darpanbiswas225@gmail.com" maxlength="100" class="box">
                        
            <p>old password</p>
            <input type="password" name="old_pass" placeholder="enter your old password" maxlength="50" class="box">

            <p>new password</p>
            <input type="password" name="new_pass" placeholder="enter your new password" maxlength="50" class="box">

            <p>confirm password</p>
            <input type="password" name="c_pass" placeholder="confirm your new password" maxlength="50" class="box">
        
            <p>update pic</p>
            <input type="file" name="image" accept="image/*" class="box">
            <input type="submit" name="submit" value="update profile" class="btn">
        
        </form>



    </section>





    <!--------- Update profile section ends  ----------------->

    <!--------- footer section starts ----------->

    <footer class="footer">

        &copy; copyright @ 2026 by <span>Darpan Biswas</span> | all rights reserved!

    </footer>

    <!--------- footer section ends ----------->

    <!--------- js file link ------->
    <script src="/Assets/JS/script.js"></script>
</body>

</html>
